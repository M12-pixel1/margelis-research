# Draft scenario definition. Illustrative identifiers only; no real systems or data.
id: credential_drift
title: Credential drift
status: draft
note_case: Credential drift
invariants: [I3, I5]
risk_class: identity-binding
preconditions:
  - Authorization was issued for executor identity E1 acting on account A1 through credential C1.
  - Before execution, C1 is remapped to account A2, or the executor workload identity changes to E2.
authorized_scope:
  action: storage.object.write
  resource: "account:EXAMPLE-A1"
  constraints:
    executor_identity: "spiffe://example.test/agent/e1"
    credential: C1
injected_failure: The credential target or the identity mapping changes between authorization and action.
expected_decision:
  any_of: [DENY, REAUTHORIZATION_REQUIRED]
  rule: The identity and authority binding is revalidated at execution. A mismatch fails closed.
expected_external_effect: No effect on account A2 and no effect by E2 under the authorization issued to E1.
expected_receipt_state:
  outcome_status_any_of: [NOT_EXECUTED]
  must_record: [executor_identity, tool_identity, authorization_time, execution_time, authorization_decision]
evidence_required:
  - Identity and credential mapping at authorization time.
  - Identity and credential mapping at execution time.
  - The revalidation decision.
  - Authoritative state of A1 and A2 showing no unauthorized write.
