name: Verified Delegation Benchmark live GitHub sandbox

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_LIVE_GITHUB_P0_3 to create and close synthetic GitHub Issues"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: vdb-live-github-${{ github.repository }}
  cancel-in-progress: false

jobs:
  live-github-sandbox:
    if: ${{ inputs.confirm == 'RUN_LIVE_GITHUB_P0_3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install hash-pinned validation dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.lock"
      - name: Run live external-system candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VDB_EVIDENCE_PATH: vdb-live-github-evidence.json
        run: python benchmark/v0.2/live/github_issues_runner.py
      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vdb-live-github-${{ github.run_id }}
          path: vdb-live-github-evidence.json
          if-no-files-found: error
          retention-days: 90
