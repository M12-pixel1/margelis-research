name: promote-benchmark-result-once

on:
  push:
    branches:
      - benchmark/v0.2-results-github-p0-3-candidate
    paths:
      - .benchmark-promote-trigger

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: benchmark/v0.2-results-github-p0-3-candidate
          fetch-depth: 0
      - name: Promote verified candidate into results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path('benchmark/v0.2')
          candidate = root / 'candidates/github-p0-3-repeatability'
          result_id = 'github-p0-3-repeatability-2026-09-17'
          result = root / 'results' / result_id
          if result.exists():
              raise SystemExit(f'result already exists: {result}')

          shutil.copytree(candidate, result)

          # Published manifest: preserve evidence/provenance, record irreversible human gate.
          mp = result / 'manifest.json'
          m = json.loads(mp.read_text(encoding='utf-8'))
          m['status'] = 'PUBLISHED_RESULT'
          m['result_id'] = result_id
          m.pop('candidate_id', None)
          m['publication_readiness'] = {
              'ready': True,
              'blockers': [],
              'human_gate': 'APPROVED',
              'human_gate_approved_by': 'Tomas Margelis',
              'human_gate_approved_on': '2026-09-17'
          }
          m['published_on'] = '2026-09-17'
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Published README: keep evidence and rerun instructions, remove pre-publication language.
          rp = result / 'README.md'
          text = rp.read_text(encoding='utf-8')
          text = text.replace(
              '# Verified Delegation Benchmark v0.2 — GitHub P0-3 repeatability candidate',
              '# Verified Delegation Benchmark v0.2 — GitHub P0-3 repeatability result'
          )
          text = text.replace(
              '**Status: CANDIDATE_NOT_PUBLISHED — READY_FOR_HUMAN_GATE.** This directory is a review package, not yet a published benchmark result and not an industry benchmark claim.',
              '**Status: PUBLISHED_RESULT.** This is a published Verified Delegation Benchmark v0.2 result bundle for the bounded GitHub Issues P0-3 experiment. It is not an industry-wide benchmark claim and does not establish generalization beyond the stated system and scenarios.'
          )
          marker = '## Remaining publication gate\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '''\n\n## Publication decision\n\nHuman Gate approved by Tomas Margelis on 2026-09-17 after two independent live runs, durable raw-evidence archival, deterministic result-bundle validation, negative validator tests and required green CI.\n\nThe limitations above remain part of the published result and must travel with any citation or comparison.\n'''
          text = text.replace(
              '`benchmark/v0.2/results/` remains unchanged and still contains only its README. No benchmark result has been published by this candidate PR.',
              f'This validated bundle is published at `benchmark/v0.2/results/{result_id}/` with its durable raw evidence and provenance.'
          )
          rp.write_text(text, encoding='utf-8')

          # Results index now truthfully lists the first published result.
          index = root / 'results/README.md'
          index.write_text(f'''# Results\n\nPublished Verified Delegation Benchmark v0.2 result bundles live here only when they include durable raw evidence, exact source/harness provenance, independent rerun instructions and pass the deterministic result-bundle validator.\n\n## Published results\n\n- [`{result_id}/`]({result_id}/) — GitHub Issues P0-3 repeatability result; two independent live runs; expired mandate, replay and false-DONE scenarios; bounded unsafe vs guarded reference systems.\n\nThe result's stated limitations are normative. Do not generalize it to payments, CRM, deployment providers, commercial agent products or industry-wide performance without additional evidence.\n''', encoding='utf-8')

          # Archive candidate state after publication instead of leaving a false pending gate.
          cmp = candidate / 'manifest.json'
          cm = json.loads(cmp.read_text(encoding='utf-8'))
          cm['status'] = 'CANDIDATE_ARCHIVED_AFTER_PUBLICATION'
          cm['publication_readiness']['human_gate'] = 'APPROVED'
          cm['publication_readiness']['human_gate_approved_by'] = 'Tomas Margelis'
          cm['publication_readiness']['human_gate_approved_on'] = '2026-09-17'
          cm['published_result_path'] = f'benchmark/v0.2/results/{result_id}'
          cmp.write_text(json.dumps(cm, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cr = candidate / 'README.md'
          ctext = cr.read_text(encoding='utf-8')
          ctext = ctext.replace(
              '**Status: CANDIDATE_NOT_PUBLISHED — READY_FOR_HUMAN_GATE.** This directory is a review package, not yet a published benchmark result and not an industry benchmark claim.',
              f'**Status: ARCHIVED CANDIDATE AFTER PUBLICATION.** Human Gate was approved on 2026-09-17. The published result is `benchmark/v0.2/results/{result_id}/`.'
          )
          marker = '## Remaining publication gate\n'
          if marker in ctext:
              ctext = ctext.split(marker, 1)[0].rstrip() + f'''\n\n## Publication outcome\n\nHuman Gate approved publication on 2026-09-17. This candidate is retained as the pre-publication audit package. The authoritative published bundle is `benchmark/v0.2/results/{result_id}/`.\n'''
          cr.write_text(ctext, encoding='utf-8')
          PY

          # The one-shot mechanism must not survive its own successful run.
          rm -f .benchmark-promote-trigger .github/workflows/promote-benchmark-result-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/v0.2 .github/workflows/promote-benchmark-result-once.yml .benchmark-promote-trigger || true
          git commit -m 'Publish Verified Delegation Benchmark v0.2 P0-3 result'
          git push origin HEAD:benchmark/v0.2-results-github-p0-3-candidate
