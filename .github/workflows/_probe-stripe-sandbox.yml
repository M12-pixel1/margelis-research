name: Probe Stripe sandbox CLI

on:
  push:
    branches:
      - benchmark/v0.2-p0-stripe-sandbox

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show Node version
        run: node --version && npm --version
      - name: Install Stripe CLI
        run: npm install -g @stripe/cli@latest
      - name: Show Stripe CLI version and anonymous sandbox help
        run: |
          stripe --version
          stripe sandbox create --help
