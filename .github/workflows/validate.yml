name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned tools
        run: python -m pip install -r tools/requirements.txt
      - name: Canonical receipt branch tests
        run: python tools/test_probe_canonical.py
      - name: Checks, byte-for-byte PDF rebuild, secret scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish.py verify --rebuild --online
