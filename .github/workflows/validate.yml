name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install hash-pinned tools
        run: python -m pip install --require-hashes -r tools/requirements.lock
      - name: Canonical receipt branch tests
        run: python tools/test_probe_canonical.py
      - name: Zenodo flow tests (simulated API)
        run: python tools/test_zenodo_flow.py
      - name: Every guard must bite (injected defects)
        run: python tools/test_checks_negative.py
      - name: Verified Delegation Benchmark P0 harness self-test
        run: python benchmark/v0.2/harness/runner.py
      - name: Verified Delegation Benchmark P0 process sandbox
        run: python benchmark/v0.2/sandbox/runner.py
      - name: Live GitHub benchmark workflow policy
        run: |
          python -m py_compile benchmark/v0.2/live/github_issues_runner.py
          python benchmark/v0.2/live/policy_check.py
      - name: Stripe Verified Action Core adapter contract
        run: |
          python -m py_compile benchmark/v0.2/live/stripe/verified_action_core_adapter.py
          python benchmark/v0.2/live/stripe/test_verified_action_core_adapter.py
      - name: Stripe signed-action cryptographic contract
        run: |
          python -m pip install -r benchmark/v0.2/live/stripe/requirements-signed-action.txt
          python -m py_compile benchmark/v0.2/live/stripe/signed_action.py
          python benchmark/v0.2/live/stripe/test_signed_action.py
      - name: Checks, byte-for-byte PDF rebuild, secret scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish.py verify --rebuild --online