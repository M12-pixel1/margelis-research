name: Patch benchmark result gate once

on:
  push:
    branches:
      - benchmark/v0.2-results-github-p0-3-candidate
    paths:
      - .vdb-validator-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace blanket no-results gate with deterministic bundle validator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/mrpub/checks.py')
          text = p.read_text(encoding='utf-8')
          old = '''    extra = [p.name for p in (root / "results").iterdir() if p.name != "README.md"]\n    out.append(Result("benchmark.no_results_published", FAIL if extra else PASS,\n                      f"unexpected files in results/: {extra}" if extra else "results/ contains only README.md"))\n    return out\n'''
          new = '''    from .benchmark_results import validate_results_dir\n    results_ok, results_detail = validate_results_dir(root)\n    out.append(Result("benchmark.result_bundles", PASS if results_ok else FAIL, results_detail))\n    return out\n'''
          if text.count(old) != 1:
              raise SystemExit('expected benchmark.no_results_published block exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -q 'benchmark.result_bundles' tools/mrpub/checks.py
          ! grep -q 'benchmark.no_results_published' tools/mrpub/checks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/mrpub/checks.py
          git rm .github/workflows/patch-benchmark-result-gate-once.yml .vdb-validator-patch-trigger
          git commit -m 'Replace blanket result ban with deterministic bundle validation'
          git push origin HEAD:benchmark/v0.2-results-github-p0-3-candidate
