name: Archive VDB P0-3 raw evidence once

on:
  push:
    branches:
      - benchmark/v0.2-results-github-p0-3-candidate
    paths:
      - .vdb-archive-trigger

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download, verify, and archive exact raw evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='benchmark/v0.2/candidates/github-p0-3-repeatability/evidence'
          mkdir -p "$target"

          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/M12-pixel1/margelis-research/actions/artifacts/10495072219/zip' \
            -o /tmp/run1.zip
          printf '%s  %s\n' 'f99db90abe22cd7699ed732cec30fd16439818beb49ec9eed166f8ab71575fde' '/tmp/run1.zip' | sha256sum -c -
          unzip -p /tmp/run1.zip vdb-live-github-evidence.json > "$target/run-35216991313.json"
          printf '%s  %s\n' '0464389ac5752676ea942ed83793697a27667c61fed95a92cd30b931bc22b65c' "$target/run-35216991313.json" | sha256sum -c -

          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/M12-pixel1/margelis-research/actions/artifacts/10501122580/zip' \
            -o /tmp/run2.zip
          printf '%s  %s\n' 'bf32fd188aa105390e478414f6fca0c2794aee7c24026459b9f5aed71c64fbf8' '/tmp/run2.zip' | sha256sum -c -
          unzip -p /tmp/run2.zip vdb-live-github-repeat-2-evidence.json > "$target/run-35231849182.json"
          printf '%s  %s\n' '4ae11eb56ac7997265c4c31eef0cc47d9cca8a5e2a30a5f67b9fa0dc612d3ee2' "$target/run-35231849182.json" | sha256sum -c -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target/run-35216991313.json" "$target/run-35231849182.json"
          git rm .github/workflows/archive-vdb-p0-3-evidence-once.yml .vdb-archive-trigger
          git commit -m 'Archive exact raw evidence for P0-3 repeatability candidate'
          git push origin HEAD:benchmark/v0.2-results-github-p0-3-candidate
