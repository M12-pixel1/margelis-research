name: publish-note

# Manual pipeline for a committed, built note:
#   check            all checks + PDF rebuild
#   release-dry-run  print the release that would be created
#   release          immutable GitHub release (refuses to overwrite an existing tag)
#   zenodo-draft     private Zenodo draft with reserved DOI; never publishes
#   zenodo-publish   publish the existing draft (IRREVERSIBLE); runs only when
#                    confirm_doi equals the DOI reserved for that draft and the
#                    license is granted in note.yaml
on:
  workflow_dispatch:
    inputs:
      note:
        description: Note number, e.g. 002
        required: true
      action:
        description: Step to run
        type: choice
        default: check
        options: [check, release-dry-run, release, zenodo-draft, zenodo-publish]
      confirm_doi:
        description: For zenodo-publish only - the reserved DOI shown by zenodo-draft
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      NOTE: ${{ inputs.note }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned tools
        run: python -m pip install -r tools/requirements.txt
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish.py verify "$NOTE" --rebuild --online
      - name: GitHub release
        if: inputs.action == 'release' || inputs.action == 'release-dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.action == 'release-dry-run' && '--dry-run' || '' }}
        run: python tools/publish.py release "$NOTE" $DRY_RUN
      - name: Zenodo draft (no publication)
        if: inputs.action == 'zenodo-draft'
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python tools/publish.py zenodo "$NOTE"
      - name: Zenodo publish (irreversible)
        if: inputs.action == 'zenodo-publish'
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          CONFIRM_DOI: ${{ inputs.confirm_doi }}
        run: python tools/publish.py zenodo "$NOTE" --publish --confirm-doi "$CONFIRM_DOI"
      - name: Keep Zenodo record (also after a partial failure)
        if: always() && (inputs.action == 'zenodo-draft' || inputs.action == 'zenodo-publish')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zenodo-${{ inputs.note }}
          path: research/*/zenodo.json
          if-no-files-found: warn
