# Update pull requests for the SHA-pinned actions; security-only alerts for the Python tools.
#
# pip version bumps are deliberately not opened as pull requests: every bump changes
# tools/requirements.txt without the hash lock, so the repo.dependency_lock guard fails
# by design, and a reportlab bump changes the bytes of an already published PDF.
# Dependabot security updates for /tools stay enabled (open-pull-requests-limit: 0
# disables version updates only). To bump a tool on purpose: edit tools/requirements.txt,
# run `python tools/publish.py lock`, and open a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
